<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; width: 240px; padding: 10px; font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px; margin-bottom: 6px; border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
    border-radius: 8px; background: transparent; color: inherit; font: inherit; cursor: pointer; text-align: left; }
  button:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
  b { font-weight: 600; }
  small { display: block; opacity: .65; margin-top: 2px; }
  kbd { font: 11px ui-monospace, monospace; opacity: .6; white-space: nowrap; }
  #err { color: #d33; font-size: 12px; margin-top: 4px; }
  #err:empty { display: none; }
</style>
</head>
<body>
  <button data-mode="video"><span><b>Float video</b><small>Just the video, with controls</small></span><kbd>⌥⇧V</kbd></button>
  <button data-mode="tab"><span><b>Float whole tab</b><small>Live view of this tab (view-only)</small></span><kbd>⌥⇧T</kbd></button>
  <div id="err"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
